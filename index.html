<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>TodoApp</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="hd">📝 My Tasks</h1>
      <p id="greeting" class="greeting"></p>
    </header>
  <section class="main-content">
      <div class="input-section">
        <div class="input-area">
          <input id="txt-hlder" type="text" placeholder="Add a new task..." class="input-field">
          <input id="date-hlder" type="date" aria-label="Set task date" class="input-field">
          <input id="time-hlder" type="time" aria-label="Set time to complete" class="input-field">
          <select id="priority-hlder" aria-label="Select priority" class="input-field">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
          <button id="btn" class="btn-add">+ Add</button>
        </div>
      </div>
  <section class="tasks-section">
      <div id="tracker" class="tracker" aria-live="polite">Today: 0/0 completed</div>
        <ol id="task-list" class="task-list"></ol>
      </div>

      <div class="controls-section">
        <button id="view-history" class="btn-control">📊 History</button>
        <button id="export-csv" class="btn-control">📥 Export</button>
        <button id="clear-history" class="btn-control btn-danger">🗑️ Clear</button>
      </div>
    </section>
    <div id="progress-chart" class="panel" style="display:none;"></div>
    <div id="progress-heatmap" class="panel" style="display:none;"></div>
    <div id="history-panel" class="panel" aria-live="polite" style="display:none;">
      <h3>📅 Progress History</h3>
      <ul id="history-list"></ul>
    </div>
  </div>
  <script src="script.js"></script>
  </body>
</html>
